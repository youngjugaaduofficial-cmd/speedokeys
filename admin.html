<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07080f">
<title>Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07080f; --panel:#0f1120; --panel2:#171a38; --line:#252a55; --ink:#e9ebff; --muted:#8e94c0;
    --v:#8b5cf6; --c:#22d3ee; --p:#f43f9e; --ok:#34d399; --err:#fb7185; --warn:#fbbf24;
    --head:'Orbitron', system-ui, sans-serif; --body:'Rajdhani', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; color:var(--ink); font:600 17px/1.4 var(--body); min-height:100vh;
    background:
      radial-gradient(900px 500px at 90% -10%, rgba(244,63,158,.22), transparent 60%),
      radial-gradient(700px 450px at -10% 15%, rgba(139,92,246,.22), transparent 60%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/36px 36px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0/36px 36px, var(--bg);
    background-attachment: fixed;
  }
  header { position:sticky; top:0; z-index:10; background:rgba(7,8,15,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 6px; gap:10px; }
  .logo { font:900 17px var(--head); letter-spacing:1.5px; background:linear-gradient(90deg,var(--p),var(--v),var(--c)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding:6px 12px 10px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { flex:none; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font:700 14px var(--body); letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
  .tabs button.on { background:linear-gradient(90deg,var(--p),var(--v)); color:#fff; border-color:transparent; box-shadow:0 0 16px rgba(244,63,158,.4); }
  main { max-width:900px; margin:0 auto; padding:16px 16px 60px; }
  h2 { font:700 16px var(--head); letter-spacing:1px; margin:8px 0 12px; text-transform:uppercase; }
  .stack { display:flex; flex-direction:column; gap:12px; }
  .grid { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:600px) { .grid { grid-template-columns:1fr 1fr; } .grid.g3 { grid-template-columns:repeat(3,1fr); } }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (min-width:700px) { .tiles { grid-template-columns:repeat(4,1fr); } }
  .card { border:1px solid transparent; border-radius:16px; padding:16px; background:linear-gradient(160deg,var(--panel2),var(--panel)) padding-box, linear-gradient(135deg,rgba(139,92,246,.7),rgba(244,63,158,.35),rgba(34,211,238,.35)) border-box; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .card h3 { margin:0 0 4px; font:700 17px var(--head); letter-spacing:.5px; }
  .tile { border-radius:14px; padding:14px; background:linear-gradient(160deg,var(--panel2),var(--panel)); border:1px solid var(--line); }
  .tile .n { font:900 22px var(--head); color:var(--c); text-shadow:0 0 16px rgba(34,211,238,.4); word-break:break-all; }
  .tile .l { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .tile.pink .n { color:var(--p); text-shadow:0 0 16px rgba(244,63,158,.4); }
  .tile.green .n { color:var(--ok); text-shadow:0 0 16px rgba(52,211,153,.4); }
  .tile.violet .n { color:#b79cff; text-shadow:0 0 16px rgba(139,92,246,.5); }
  .tag { display:inline-block; font-size:12px; letter-spacing:1px; padding:2px 10px; border-radius:999px; background:rgba(34,211,238,.12); color:var(--c); border:1px solid rgba(34,211,238,.35); text-transform:uppercase; }
  .tag.ok { background:rgba(52,211,153,.12); color:var(--ok); border-color:rgba(52,211,153,.4); }
  .tag.bad { background:rgba(251,113,133,.12); color:var(--err); border-color:rgba(251,113,133,.4); }
  .tag.warn { background:rgba(251,191,36,.12); color:var(--warn); border-color:rgba(251,191,36,.4); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .gap { display:flex; gap:8px; flex-wrap:wrap; }
  .muted { color:var(--muted); } .small { font-size:14px; } .err { color:var(--err); } .ok { color:var(--ok); }
  .btn { font:700 15px var(--body); letter-spacing:1px; text-transform:uppercase; cursor:pointer; color:var(--ink); padding:9px 14px; border-radius:11px; border:1px solid var(--line); background:var(--panel2); }
  .btn:active { transform:scale(.97); }
  .btn.primary { border:0; color:#fff; background:linear-gradient(90deg,var(--p),var(--v)); box-shadow:0 0 20px rgba(244,63,158,.35); }
  .btn.danger { color:var(--err); border-color:rgba(251,113,133,.5); background:transparent; }
  .btn.full { width:100%; }
  .btn:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
  input, select, textarea { font:600 16px var(--body); width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line); background:#0b0d1d; color:var(--ink); outline:none; }
  textarea { resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace; }
  input:focus, select:focus, textarea:focus { border-color:var(--v); box-shadow:0 0 0 3px rgba(139,92,246,.25); }
  label { display:block; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:0 0 4px; }
  .key { font:700 15px ui-monospace,Menlo,Consolas,monospace; word-break:break-all; user-select:all; background:#070916; border:1px dashed rgba(34,211,238,.45); color:var(--c); padding:8px 10px; border-radius:9px; }
  .banner { border-radius:12px; padding:10px 14px; background:rgba(251,191,36,.1); border:1px dashed rgba(251,191,36,.6); color:var(--warn); font-size:14px; }
  .alert { border-radius:12px; padding:10px 14px; background:rgba(244,63,158,.12); border:1px solid rgba(244,63,158,.5); }
  .bars { display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:10px; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; min-width:0; }
  .bar i { width:100%; max-width:46px; border-radius:8px 8px 3px 3px; background:linear-gradient(180deg,var(--c),var(--v)); box-shadow:0 0 14px rgba(34,211,238,.35); min-height:3px; }
  .bar span { font-size:11px; color:var(--muted); } .bar b { font-size:11px; }
  .overlay { position:fixed; inset:0; z-index:30; background:rgba(3,4,10,.78); backdrop-filter:blur(4px); display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:600px) { .overlay { align-items:center; padding:16px; } }
  .modal { width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:18px; display:flex; flex-direction:column; gap:12px; background:linear-gradient(160deg,var(--panel2),var(--panel)) padding-box, linear-gradient(135deg,var(--p),var(--v),var(--c)) border-box; border:1px solid transparent; }
  @media (min-width:600px) { .modal { border-radius:22px; } }
  #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#0b0d1d; border:1px solid var(--p); padding:10px 16px; border-radius:12px; max-width:90%; display:none; z-index:50; text-align:center; box-shadow:0 0 24px rgba(244,63,158,.45); }
  .spin { width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--p); animation:sp .8s linear infinite; display:inline-block; vertical-align:middle; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header id="hdr" style="display:none">
  <div class="top"><div class="logo" id="logo">ADMIN PANEL</div><button class="btn" id="logout">Log out</button></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="view"></main>
<div id="toast"></div>

<script>
(() => {
'use strict';
const view = document.getElementById('view');
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid); }
  return e;
}
const rupees = (v) => '₹' + (Number.isInteger(v) ? v : Number(v).toFixed(2));
const when = (ms) => ms ? new Date(ms).toLocaleString([], { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), 3500); }
function modal(...content) {
  const ov = h('div', { class: 'overlay' }, h('div', { class: 'modal' }, ...content));
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  ov.close = () => ov.remove(); document.body.append(ov); return ov;
}
function copyText(text) {
  const ok = () => toast('Copied');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, () => toast('Press and hold to copy'));
  else { const ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Press and hold to copy'); } ta.remove(); }
}
const ss = {
  get() { try { return sessionStorage.getItem('adm_token'); } catch (e) { return null; } },
  set(v) { try { sessionStorage.setItem('adm_token', v); } catch (e) {} },
  del() { try { sessionStorage.removeItem('adm_token'); } catch (e) {} },
};
let token = ss.get();
let tab = 'dash';

async function api(method, path, body) {
  let res;
  try { res = await fetch(path, { method, headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Cannot reach the server. Check your internet.'); }
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401 && token) { token = null; ss.del(); toast('Session expired. Log in again.'); draw(); }
    const err = new Error(data.error || 'Error ' + res.status); err.code = res.status; throw err;
  }
  return data;
}
const busy = () => h('div', { class: 'muted' }, h('span', { class: 'spin' }), ' Loading…');
const errBox = (e) => h('p', { class: 'err' }, e.message);
const statusTag = (s) => h('span', { class: 'tag ' + (['completed', 'paid', 'available'].includes(s) ? 'ok' : ['pending', 'sold'].includes(s) ? 'warn' : 'bad') }, s);

// ---------- shell ----------
const TABS = [['dash', '📊 Dashboard'], ['products', '🎮 Products'], ['categories', '🗂 Categories'], ['orders', '🧾 Orders'], ['users', '👥 Users'], ['coupons', '🎟 Coupons'], ['payments', '💳 Payments'], ['referrals', '🎁 Referrals'], ['settings', '⚙ Settings']];
function draw() {
  const hdr = document.getElementById('hdr');
  if (!token) { hdr.style.display = 'none'; return loginView(); }
  hdr.style.display = 'block';
  document.getElementById('tabs').replaceChildren(...TABS.map(([id, label]) => h('button', { class: tab === id ? 'on' : '', onclick: () => { tab = id; draw(); } }, label)));
  ({ dash: dashView, products: productsView, categories: categoriesView, orders: ordersView, users: usersView, coupons: couponsView, payments: paymentsView, referrals: referralsView, settings: settingsView })[tab]();
}
document.getElementById('logout').addEventListener('click', () => { token = null; ss.del(); draw(); });

function loginView() {
  const pw = h('input', { type: 'password', placeholder: 'Admin password', autocomplete: 'current-password' });
  const btn = h('button', { class: 'btn primary full' }, 'Enter');
  const go = async () => {
    btn.disabled = true;
    try { const r = await api('POST', '/api/admin/login', { password: pw.value }); token = r.token; ss.set(token); draw(); }
    catch (e) { toast(e.message); btn.disabled = false; }
  };
  btn.addEventListener('click', go); pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  view.replaceChildren(h('div', { class: 'card stack', style: 'max-width:380px;margin:12vh auto 0' },
    h('div', { class: 'logo', style: 'font-size:22px;text-align:center' }, 'ADMIN PANEL'), h('div', { class: 'muted', style: 'text-align:center' }, 'Authorised access only'), pw, btn));
}

// ---------- dashboard ----------
async function dashView() {
  view.replaceChildren(busy());
  try {
    const s = await api('GET', '/api/admin/stats');
    const max = Math.max(1, ...s.last7days.map((d) => d.revenue));
    view.replaceChildren(h('div', { class: 'stack' },
      s.testMode ? h('div', { class: 'banner' }, 'TEST MODE: payments are simulated. Connect a real payment gateway before selling.') : null,
      s.pendingPayments ? h('div', { class: 'alert row' }, h('span', {}, '⏳ ' + s.pendingPayments + ' payment(s) waiting'), h('button', { class: 'btn', onclick: () => { tab = 'payments'; draw(); } }, 'Review')) : null,
      h('div', { class: 'tiles' },
        tile('Revenue today', rupees(s.revenueToday), 'green'), tile('Total revenue', rupees(s.revenueTotal), 'green'),
        tile('Orders today', s.ordersToday), tile('Total orders', s.ordersTotal),
        tile('Users', s.usersTotal, 'violet'), tile('New today', s.usersToday, 'violet'),
        tile('Keys in stock', s.stockTotal, 'pink'), tile('Wallet money held', rupees(s.walletBalances), 'pink')),
      h('div', { class: 'card' }, h('h3', {}, 'Last 7 days'),
        h('div', { class: 'bars' }, s.last7days.map((d) => h('div', { class: 'bar', title: d.date + ': ' + rupees(d.revenue) + ', ' + d.orders + ' orders' },
          h('b', {}, d.revenue ? rupees(d.revenue) : ''), h('i', { style: 'height:' + Math.max(2, Math.round((d.revenue / max) * 100)) + '%' }), h('span', {}, d.date.slice(8)))))),
      h('div', { class: 'grid' },
        h('div', { class: 'card stack' }, h('h3', {}, '⚠ Low stock'),
          ...(s.lowStock.length ? s.lowStock.map((p) => h('div', { class: 'row' }, h('span', {}, p.name), h('span', { class: 'tag ' + (p.left === 0 ? 'bad' : 'warn') }, p.left + ' left'))) : [h('div', { class: 'muted' }, 'All products are well stocked.')])),
        h('div', { class: 'card stack' }, h('h3', {}, '🏆 Top sellers'),
          ...(s.topProducts.length ? s.topProducts.map((p) => h('div', { class: 'row' }, h('span', {}, p.name), h('span', { class: 'muted' }, p.sold + ' sold • ' + rupees(p.revenue)))) : [h('div', { class: 'muted' }, 'No sales yet.')])))));
  } catch (e) { view.replaceChildren(errBox(e)); }
}
const tile = (label, value, color) => h('div', { class: 'tile ' + (color || '') }, h('div', { class: 'n' }, String(value)), h('div', { class: 'l' }, label));

// ---------- products ----------
async function productForm(p, onDone) {
  let cats = [];
  try { cats = await api('GET', '/api/admin/categories'); } catch (e) { toast(e.message); }
  const name = h('input', { placeholder: 'Name', value: p ? p.name : '' });
  const cat = h('select', {});
  cat.append(h('option', { value: '' }, 'Choose a category'));
  cats.forEach((c) => cat.append(h('option', { value: c.name }, c.name)));
  if (p && p.category && !cats.some((c) => c.name === p.category)) cat.append(h('option', { value: p.category }, p.category + ' (legacy)'));
  cat.value = p ? (p.category || '') : '';
  const desc = h('input', { placeholder: 'Short description (e.g. 1 day)', value: p ? p.description : '' });
  const websiteUrl = h('input', { placeholder: 'Website link (https://example.com)', value: p ? (p.websiteUrl || '') : '' });
  websiteUrl.type = 'url';
  const price = h('input', { placeholder: 'Price in ₹', inputmode: 'decimal', value: p ? String(p.price) : '' });
  const btn = h('button', { class: 'btn primary full' }, p ? 'Save changes' : 'Add product');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      if (!cat.value) throw new Error('Pehle Categories tab mein category banao aur select karo.');
      const body = { name: name.value, category: cat.value, description: desc.value, websiteUrl: websiteUrl.value, price: Number(price.value) };
      if (p) await api('PUT', '/api/admin/products/' + p.id, body); else await api('POST', '/api/admin/products', body);
      toast(p ? 'Saved' : 'Product added'); onDone();
    } catch (e) { toast(e.message); btn.disabled = false; }
  });
  return [h('div', {}, h('label', {}, 'Name'), name), h('div', {}, h('label', {}, 'Category (create first in Categories tab)'), cat), h('div', {}, h('label', {}, 'Description'), desc), h('div', {}, h('label', {}, 'Website link where this key/service is used'), websiteUrl), h('div', {}, h('label', {}, 'Price (₹)'), price), btn];
}

async function categoriesView() {
  view.replaceChildren(busy());
  try {
    const cats = await api('GET', '/api/admin/categories');
    const name = h('input', { placeholder: 'New category name (e.g. VPN, Gaming, Software)' });
    const add = h('button', { class: 'btn primary full' }, '＋ Create category');
    add.addEventListener('click', async () => { add.disabled = true; try { await api('POST', '/api/admin/categories', { name: name.value }); toast('Category created'); categoriesView(); } catch (e) { toast(e.message); add.disabled = false; } });
    view.replaceChildren(h('div', { class: 'stack' }, h('div', { class: 'card stack' }, h('h3', {}, '🗂 Create category first'), h('p', { class: 'muted small' }, 'Products ko category mein add karne se pehle yahan category banao.'), name, add), h('div', { class: 'grid' }, ...(cats.length ? cats.map((c) => h('div', { class: 'card stack' }, h('h3', {}, c.name), h('div', { class: 'muted' }, c.productCount + ' products'), h('div', { class: 'gap' }, h('button', { class: 'btn', onclick: async () => { const next = prompt('New category name', c.name); if (!next || !next.trim()) return; try { await api('PUT', '/api/admin/categories/' + c.id, { name: next.trim() }); toast('Category renamed'); categoriesView(); } catch (e) { toast(e.message); } } }, 'Rename'), h('button', { class: 'btn danger', onclick: async () => { if (!confirm('Delete category ' + c.name + '?')) return; try { await api('DELETE', '/api/admin/categories/' + c.id); categoriesView(); } catch (e) { toast(e.message); } } }, 'Delete')))) : [h('p', { class: 'muted' }, 'Abhi koi category nahi hai.')]))));
  } catch (e) { view.replaceChildren(errBox(e)); }
}

async function productsView() {
  view.replaceChildren(busy());
  try {
    const list = await api('GET', '/api/admin/products');
    const addForm = await productForm(null, () => productsView());
    const addBox = h('div', { class: 'card stack', style: 'display:none' }, h('h3', {}, 'New product'), ...addForm);
    view.replaceChildren(h('div', { class: 'stack' },
      h('button', { class: 'btn primary', onclick: () => { addBox.style.display = addBox.style.display === 'none' ? 'flex' : 'none'; } }, '＋ New product'), addBox,
      h('div', { class: 'grid' }, ...(list.length ? list.map((p) => h('div', { class: 'card stack' },
        h('div', { class: 'row' }, h('h3', { style: 'margin:0' }, p.name), h('span', { class: 'tag ' + (p.active ? 'ok' : 'bad') }, p.active ? 'Live' : 'Hidden')),
        h('div', { class: 'muted' }, [p.category, p.description].filter(Boolean).join(' • ') || '—'),
        p.websiteUrl ? h('a', { href: p.websiteUrl, target: '_blank', rel: 'noopener noreferrer', class: 'btn' }, '🌐 Open website link') : null,
        h('div', { class: 'row' }, h('b', { style: 'color:var(--c);font-size:20px' }, rupees(p.price)), h('span', { class: p.available <= 3 ? 'err' : 'muted' }, p.available + ' in stock • ' + p.sold + ' sold')),
        h('div', { class: 'gap' },
          h('button', { class: 'btn primary', onclick: () => keysModal(p) }, '🔑 Keys'),
          h('button', { class: 'btn', onclick: async () => { const form = await productForm(p, () => { ov.close(); productsView(); }); const ov = modal(h('h3', { style: 'margin:0' }, 'Edit product'), ...form); } }, 'Edit'),
          h('button', { class: 'btn', onclick: async () => { try { await api('PUT', '/api/admin/products/' + p.id, { active: !p.active }); productsView(); } catch (e) { toast(e.message); } } }, p.active ? 'Hide' : 'Show'),
          h('button', { class: 'btn danger', onclick: async () => { if (!confirm('Delete "' + p.name + '"? Unsold keys will be removed. Past orders are kept.')) return; try { await api('DELETE', '/api/admin/products/' + p.id); productsView(); } catch (e) { toast(e.message); } } }, 'Delete')))) :
        [h('p', { class: 'muted' }, 'No products yet. Tap "New product" to start.')]))));
  } catch (e) { view.replaceChildren(errBox(e)); }
}

async function keysModal(p) {
  const body = h('div', { class: 'stack' }, busy());
  const ov = modal(h('div', { class: 'row' }, h('h3', { style: 'margin:0' }, '🔑 ' + p.name), h('button', { class: 'btn', onclick: () => { ov.close(); productsView(); } }, 'Close')), body);
  let filter = 'all';
  async function paint() {
    let keys;
    try { keys = await api('GET', '/api/admin/products/' + p.id + '/keys'); } catch (e) { return body.replaceChildren(errBox(e)); }
    const ta = h('textarea', { rows: '4', placeholder: 'Paste your keys, one per line' });
    const save = h('button', { class: 'btn primary' }, 'Save keys');
    save.addEventListener('click', async () => { save.disabled = true; try { const r = await api('POST', '/api/admin/products/' + p.id + '/keys', { keys: ta.value }); toast('Added ' + r.added + (r.skipped ? ', skipped ' + r.skipped + ' duplicates' : '')); paint(); } catch (e) { toast(e.message); save.disabled = false; } });
    const count = h('input', { value: '10', inputmode: 'numeric' });
    const prefix = h('input', { placeholder: 'Prefix (optional)', maxlength: '10' });
    const gen = h('button', { class: 'btn' }, 'Generate');
    gen.addEventListener('click', async () => { gen.disabled = true; try { const r = await api('POST', '/api/admin/products/' + p.id + '/generate', { count: Number(count.value), prefix: prefix.value }); toast('Generated ' + r.added + ' keys'); paint(); } catch (e) { toast(e.message); gen.disabled = false; } });

async function userModal(id) {
