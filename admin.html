<style>

  }

  .stack { display:flex; flex-direction:column; gap:12px; }

  .card { border:1px solid transparent; border-radius:16px; padding:16px; background:linear-gradient(160deg,var(--panel2),var(--panel)) padding-box, linear-gradient(135deg,rgba(139,92,246,.7),rgba(244,63,158,.35),rgba(34,211,238,.35)) border-box; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .card h3 { margin:0 0 4px; font:700 17px var(--head); letter-spacing:.5px; }

  .tile .n { font:900 22px var(--head); color:var(--c); text-shadow:0 0 16px rgba(34,211,238,.4); word-break:break-all; }
  .tile .l { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }

  .tile.violet .n { color:#b79cff; text-shadow:0 0 16px rgba(139,92,246,.5); }
  .tag { display:inline-block; font-size:12px; letter-spacing:1px; padding:2px 10px; border-radius:999px; background:rgba(34,211,238,.12); color:var(--c); border:1px solid rgba(34,211,238,.35); text-transform:uppercase; }
  .tag.ok { background:rgba(52,211,153,.12); color:var(--ok); border-color:rgba(52,211,153,.4); }
  .tag.bad { background:rgba(251,113,133,.12); color:var(--err); border-color:rgba(251,113,133,.4); }
  .tag.warn { background:rgba(251,191,36,.12); color:var(--warn); border-color:rgba(251,191,36,.4); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .gap { display:flex; gap:8px; flex-wrap:wrap; }
  .muted { color:var(--muted); } .small { font-size:14px; } .err { color:var(--err); } .ok { color:var(--ok); }

  .btn:active { transform:scale(.97); }
  .btn.primary { border:0; color:#fff; background:linear-gradient(90deg,var(--p),var(--v)); box-shadow:0 0 20px rgba(244,63,158,.35); }
  .btn.danger { color:var(--err); border-color:rgba(251,113,133,.5); background:transparent; }

  .btn:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }

  .key { font:700 15px ui-monospace,Menlo,Consolas,monospace; word-break:break-all; user-select:all; background:#070916; border:1px dashed rgba(34,211,238,.45); color:var(--c); padding:8px 10px; border-radius:9px; }
  .banner { border-radius:12px; padding:10px 14px; background:rgba(251,191,36,.1); border:1px dashed rgba(251,191,36,.6); color:var(--warn); font-size:14px; }
  .alert { border-radius:12px; padding:10px 14px; background:rgba(244,63,158,.12); border:1px solid rgba(244,63,158,.5); }
  .bars { display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:10px; }

  .modal { width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:18px; display:flex; flex-direction:column; gap:12px; background:linear-gradient(160deg,var(--panel2),var(--panel)) padding-box, linear-gradient(135deg,var(--p),var(--v),var(--c)) border-box; border:1px solid transparent; }

  .sb-n{flex:1;overflow:auto;padding:4px 12px 12px;scrollbar-width:thin}

  .sb-f select{width:100%}

  #ptitle{flex:1;font:700 18px var(--head);letter-spacing:.5px}

  .chipb i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .chipb.m i{background:var(--err);box-shadow:0 0 10px var(--err)}
  .qa{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.qa .btn{flex:none}
  #view>*{animation:vin .35s both}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
  @media(min-width:960px){#side{transform:none;box-shadow:none}#mw{margin-left:292px}#burger,#close,#scrim{display:none}main{max-width:1000px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .ta{width:100%;min-height:84px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
  .bub{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .bub.adm{align-self:flex-end;background:color-mix(in srgb,var(--v) 35%,var(--panel2))}
  .bub small{display:block;opacity:.6;margin-top:4px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--warn);margin-right:8px}
  .meter{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--err));background-size:300% 100%}
  .stars{color:var(--warn);letter-spacing:2px}
  .res{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}
  .res button{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;cursor:pointer}.res button:hover{border-color:var(--v)}

<script>
(() => {
'use strict';
const view = document.getElementById('view');
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid); }
  return e;
}
const rupees = (v) => '₹' + (Number.isInteger(v) ? v : Number(v).toFixed(2));

function openSearch() {
  const q = h('input', { placeholder: 'Search users, orders, products, tickets…', autofocus: 'autofocus' });
  const box = h('div', { class: 'res' }, h('div', { class: 'muted small' }, 'Type at least 2 letters. Shortcut: / or Ctrl+K'));
  const ov = modal(h('h3', {}, 'Search'), q, box);
  let t;
  const row = (title, sub, tabName) => h('button', { onclick: () => { ov.close(); go(tabName); } }, h('b', {}, title), h('div', { class: 'muted small' }, sub));
  q.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      if (q.value.trim().length < 2) return;
      try {
        const r = await api('GET', '/api/admin/search?q=' + encodeURIComponent(q.value.trim()));
        const items = [...r.users.map((u) => row('👤 ' + u.username, rupees(u.balance) + (u.banned ? ' • banned' : ''), 'users')), ...r.orders.map((o) => row('🧾 ' + o.product, o.username + ' • ' + rupees(o.paid), 'orders')), ...r.products.map((p) => row('🎮 ' + p.name, rupees(p.price), 'products')), ...r.tickets.map((x) => row('💬 ' + x.subject, x.username + ' • ' + x.status, 'tickets'))];
        box.replaceChildren(...(items.length ? items : [h('div', { class: 'muted' }, 'Nothing found.')]));
      } catch (e) { box.replaceChildren(errBox(e)); }
    }, 250);
  });
  setTimeout(() => q.focus(), 50);
}

async function downloadAuth(path, name) {
  try {
    const r = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('Download failed');
    const a = h('a', { href: URL.createObjectURL(await r.blob()), download: name }); document.body.append(a); a.click(); a.remove();
  } catch (e) { toast(e.message); }
}

// ---------- banners ----------
function shrinkImage(file, maxW, q) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxW / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => no(new Error('Could not read this image'));
    img.src = url;
  });
}
async function bannersView() {
  view.replaceChildren(busy());
  try {
    const list = await api('GET', '/api/admin/banners');
    const imgIn = h('input', { type: 'url', placeholder: 'https://... image link (best, no size limit)' });
    const file = h('input', { type: 'file', accept: 'image/*' });
    const title = h('input', { placeholder: 'Title (optional)', maxlength: '80' });
    const link = h('input', { placeholder: 'Click link (optional) https://...' });
    const prev = h('img', { style: 'max-width:100%;border-radius:12px;display:none' });
    let data = '';
    file.addEventListener('change', async () => {
      if (!file.files[0]) return;
      try { data = await shrinkImage(file.files[0], 1200, 0.72); prev.src = data; prev.style.display = 'block'; toast('Compressed to ' + Math.round(data.length / 1024) + ' KB'); } catch (e) { toast(e.message); }
    });
    const add = h('button', { class: 'btn primary' }, 'Add banner');
    add.addEventListener('click', async () => {
      const image = imgIn.value.trim() || data;
      if (!image) return toast('Upload an image or paste a link');
      add.disabled = true;
      try { await api('POST', '/api/admin/banners', { image, title: title.value, link: link.value }); toast('Banner added'); bannersView(); } catch (e) { toast(e.message); add.disabled = false; }
    });
    const act = (b, body) => async () => { try { await api('PUT', '/api/admin/banners/' + b.id, body); bannersView(); } catch (e) { toast(e.message); } };
    view.replaceChildren(h('div', { class: 'stack' },
      h('div', { class: 'card stack' }, h('h3', {}, 'New banner'),
        h('p', { class: 'muted small' }, 'Best size 1200x400. Uploaded photos are auto-compressed, but a link (imgbb, Cloudinary) keeps your database light. Max 8 banners.'),
        file, prev, h('div', { class: 'muted small' }, 'or'), imgIn, title, link, add),
      h('h2', {}, 'Live banners (' + list.length + ')'),
      ...list.map((b, i) => h('div', { class: 'card stack' },
        h('img', { src: b.image, style: 'width:100%;border-radius:12px;max-height:160px;object-fit:cover', alt: '' }),
        h('div', { class: 'row' }, h('b', {}, b.title || 'Untitled'), h('span', { class: 'tag ' + (b.active ? 'ok' : 'bad') }, b.active ? 'visible' : 'hidden')),
        b.link ? h('div', { class: 'muted small', style: 'word-break:break-all' }, b.link) : null,
        h('div', { class: 'gap' },
          h('button', { class: 'btn', disabled: i === 0 ? 'disabled' : false, onclick: act(b, { move: 'up' }) }, '↑'),
          h('button', { class: 'btn', disabled: i === list.length - 1 ? 'disabled' : false, onclick: act(b, { move: 'down' }) }, '↓'),
          h('button', { class: 'btn', onclick: act(b, { active: !b.active }) }, b.active ? 'Hide' : 'Show'),
          h('button', { class: 'btn danger', onclick: async () => { if (!confirm('Delete this banner?')) return; try { await api('DELETE', '/api/admin/banners/' + b.id); bannersView(); } catch (e) { toast(e.message); } } }, 'Delete')))),
      list.length ? null : h('p', { class: 'muted' }, 'No banners yet. The shop shows no slider until you add one.')));
  } catch (e) { view.replaceChildren(errBox(e)); }
}
