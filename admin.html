<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Admin Panel</title>
<style>
/* ADMIN PANEL — simple white, system fonts */
:root{
  color-scheme:light;
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f5; --line:#dfe3e8; --ink:#1b1f24; --muted:#6b7280;
  --accent:#111827; --ok:#15803d; --err:#b91c1c; --warn:#b45309;
  --v:#111827; --c:#111827; --p:#111827;
  --head:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --body:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);min-height:100vh}
a{color:#1d4ed8}
h2{font:600 17px var(--head);margin:8px 0 12px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{margin:0 0 4px;font:600 16px var(--head)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile .n{font:700 22px var(--head);color:var(--ink);word-break:break-all}
.tile .l{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.tag.ok{background:#ecfdf3;color:var(--ok);border-color:#b7e4c7}
.tag.bad{background:#fef2f2;color:var(--err);border-color:#f5c2c2}
.tag.warn{background:#fffbeb;color:var(--warn);border-color:#f3d9a4}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gap{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}.err{color:var(--err)}.ok{color:var(--ok)}
.btn{font:500 14px var(--body);cursor:pointer;color:var(--ink);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#000}
.btn.danger{color:var(--err);border-color:#f0b4b4;background:var(--panel)}
.btn.danger:hover{background:#fef2f2}
.btn.full{width:100%}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:400 15px var(--body);width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}
textarea{resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}
input:focus,select:focus,textarea:focus{border-color:#6b7280;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.key{font:500 14px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;user-select:all;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:8px}
.banner{border-radius:8px;padding:10px 14px;background:#fffbeb;border:1px solid #f3d9a4;color:var(--warn);font-size:14px}
.alert{border-radius:8px;padding:10px 14px;background:#fef2f2;border:1px solid #f5c2c2;color:#7f1d1d}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:#374151;min-height:3px}
.bar span{font-size:11px;color:var(--muted)}.bar b{font-size:11px}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(17,24,39,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.overlay{align-items:center;padding:16px}}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.18)}
@media(min-width:600px){.modal{border-radius:14px}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;max-width:90%;display:none;z-index:50;text-align:center}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:#111827;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
#side{position:fixed;inset:0 auto 0 0;width:260px;max-width:86vw;z-index:40;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .25s ease}
#side.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
.sb-h{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.sb-l{width:34px;height:34px;border-radius:8px;background:#111827}
.sb-t{flex:1;font:700 17px var(--head)}
.ib{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--panel2)}
.sb-n{flex:1;overflow:auto;padding:4px 12px 12px}
.sb-g{font:600 11px var(--body);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
.sb-i{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border-radius:8px;border:0;background:0;color:var(--ink);font:500 15px var(--body);cursor:pointer;text-align:left}
.sb-i:hover{background:var(--panel2)}
.sb-i.on{background:#111827;color:#fff}
.sb-i svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb-i>span+span{flex:1}
.bdg{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:#dc2626;color:#fff;font:700 12px/22px var(--body);text-align:center}
.sb-f{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sb-f select{width:100%}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;padding-top:calc(10px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line)}
#ptitle{flex:1;font:600 17px var(--head)}
.chipb{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font:500 14px var(--body);cursor:pointer}
.chipb i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--ok)}
.chipb.m i{background:var(--err)}
.qa{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.qa .btn{flex:none}
main{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
#view{max-width:1180px;padding-top:20px}
@media(min-width:960px){#side{transform:none}#mw{margin-left:260px}#burger,#close,#scrim{display:none}}
.logo{font:700 17px var(--head);color:var(--ink)}
.ta{width:100%;min-height:84px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
.bub{max-width:88%;padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.bub.adm{align-self:flex-end;background:#e5e7eb}
.bub small{display:block;opacity:.6;margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;margin-right:8px}
.meter{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}.meter i{display:block;height:100%;background:#374151}
.stars{color:#b45309;letter-spacing:2px}
.res{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}
.res button{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;cursor:pointer}.res button:hover{background:var(--panel2)}
/* duration plan editor */
.planrow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto auto;gap:6px;align-items:center}.planrow input{min-width:0}
.plan-on{display:flex;align-items:center;gap:4px;margin:0;font-size:12px}.plans{display:flex;flex-direction:column;gap:2px}
@media(max-width:520px){.planrow{grid-template-columns:1fr 1fr 1fr}}
/* support chat */
.wa{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 130px);min-height:420px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.wa-list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}.wa-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.wa-search{margin:0 12px 10px;width:calc(100% - 24px)!important;border-radius:999px!important}.wa-rows{overflow:auto;flex:1}
.wa-row{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:inherit}.wa-row:hover,.wa-row.on{background:var(--panel2)}
.wa-av{flex:none;width:42px;height:42px;border-radius:50%;background:#e5e7eb;color:#111827;display:grid;place-items:center;font:700 17px var(--head)}
.wa-mid{flex:1;min-width:0}.wa-name{font-weight:600;display:flex;gap:8px;align-items:center}.wa-closed{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.wa-prev{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wa-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}.wa-time{font-size:12px;color:var(--muted)}
.wa-badge{min-width:22px;height:22px;border-radius:99px;background:#dc2626;color:#fff;font:700 12px/22px var(--body);text-align:center;padding:0 6px}.wa-empty{padding:24px 16px}
.wa-thread{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}.wa-none{margin:auto;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px}
.wa-thead{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff}.wa-back{display:none;border:0;background:0;color:var(--ink);font-size:24px;cursor:pointer}
.wa-body{flex:1;overflow:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:4px}
.wa-day{align-self:center;margin:10px 0}.wa-day span{font-size:12px;color:var(--muted);background:#e5e7eb;border-radius:8px;padding:3px 10px}
.wa-msg{max-width:min(78%,520px);padding:7px 10px 4px;border-radius:12px;word-break:break-word}.wa-msg.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-top-left-radius:3px}.wa-msg.out{align-self:flex-end;background:#111827;color:#fff;border-top-right-radius:3px}
.wa-txt{white-space:pre-wrap;font-size:15px;line-height:1.35}.wa-ts{font-size:11px;text-align:right;opacity:.6;margin-top:2px}.wa-tick{letter-spacing:-2px;font-weight:700}
.wa-bar{display:flex;gap:8px;align-items:flex-end;padding:10px;background:#fff;border-top:1px solid var(--line)}
.wa-input{flex:1;resize:none;border-radius:22px!important;min-height:42px;max-height:120px;padding:10px 16px!important;font-family:var(--body)!important}
.wa-send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#111827;color:#fff;display:grid;place-items:center;cursor:pointer}.wa-send:disabled{opacity:.5}
@media(max-width:760px){.wa{grid-template-columns:1fr;height:calc(100vh - 110px)}.wa-thread{display:none}.wa.show .wa-list{display:none}.wa.show .wa-thread{display:flex}.wa-back{display:block}}
</style>
</head>
<body>
<div id="shell" style="display:none">
<aside id="side" aria-label="Menu"></aside><div id="scrim"></div>
<div id="mw"><div class="topbar"><button class="ib" id="burger" aria-label="Menu"></button><div id="ptitle">Dashboard</div><button class="ib" id="srch" aria-label="Search"></button><button id="shopchip" class="chipb"></button></div>
<main id="view"></main></div></div>
<main id="loginview"></main>
<div id="toast"></div>

<script>
(() => {
'use strict';
const view = document.getElementById('view');
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid); }
  return e;
}
const rupees = (v) => '₹' + (Number.isInteger(v) ? v : Number(v).toFixed(2));
const when = (ms) => ms ? new Date(ms).toLocaleString([], { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), 3500); }
function modal(...content) {
  const ov = h('div', { class: 'overlay' }, h('div', { class: 'modal' }, ...content));
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  ov.close = () => ov.remove(); document.body.append(ov); return ov;
}
function copyText(text) {
  const ok = () => toast('Copied');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, () => toast('Press and hold to copy'));
  else { const ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Press and hold to copy'); } ta.remove(); }
}
const ss = {
  get() { try { return sessionStorage.getItem('adm_token'); } catch (e) { return null; } },
  set(v) { try { sessionStorage.setItem('adm_token', v); } catch (e) {} },
  del() { try { sessionStorage.removeItem('adm_token'); } catch (e) {} },
};
let token = ss.get();
let tab = 'dash';

async function api(method, path, body) {
  let res;
  try { res = await fetch(path, { method, headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Cannot reach the server. Check your internet.'); }
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401 && token) { token = null; ss.del(); toast('Session expired. Log in again.'); draw(); }
    const err = new Error(data.error || 'Error ' + res.status); err.code = res.status; err.data = data; throw err;
  }
  return data;
}
const busy = () => h('div', { class: 'muted' }, h('span', { class: 'spin' }), ' Loading…');
const errBox = (e) => h('p', { class: 'err' }, e.message);
const statusTag = (s) => h('span', { class: 'tag ' + (['completed', 'paid', 'available'].includes(s) ? 'ok' : ['pending', 'sold'].includes(s) ? 'warn' : 'bad') }, s);

// ---------- shell ----------
const IC = {
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', game: '<rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 10v4M5 12h4M16 11h.01M18 13h.01"/>', image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>',
  receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>', card: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>', tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="8" cy="9" r="1"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0114 0M16 4a3.5 3.5 0 010 7M22 21a7 7 0 00-4-6"/>', palette: '<path d="M12 3a9 9 0 100 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a4 4 0 004-4c0-5-4.5-10-9-10z"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="7" r="1"/><circle cx="16" cy="10" r="1"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  chat: '<path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6A8 8 0 1121 12z"/>', star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>', bell: '<path d="M6 9a6 6 0 1112 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 004 0"/>', shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>', rocket: '<path d="M5 15c-1 1-2 4-2 6 2 0 5-1 6-2M14 4c4 0 6 2 6 6-2 4-5 7-9 8l-5-5c1-4 4-7 8-9zM15 9h.01"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', out: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>', ext: '<path d="M15 3h6v6M10 14L21 3M18 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h5"/>',
};
const icon = (n) => { const s = document.createElement('span'); s.style.display = 'flex'; s.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + IC[n] + '</svg>'; return s; };
const NAV = [
  ['Overview', [['dash', 'Dashboard', 'chart']]],
  ['Catalog', [['products', 'Products', 'game'], ['banners', 'Banners', 'image'], ['seo', 'SEO', 'list']]],
  ['Sales', [['orders', 'Orders', 'receipt'], ['payments', 'Payments', 'card'], ['coupons', 'Coupons', 'tag']]],
  ['People', [['users', 'Users', 'users'], ['tickets', 'Support chat', 'chat'], ['reviews', 'Reviews', 'star'], ['growth', 'Rewards & referrals', 'chart'], ['affiliates', 'Affiliates', 'link']]],
  ['Messages', [['notices', 'Notices', 'bell']]],
  ['System', [['look', 'Appearance & tools', 'gear'], ['security', 'Security', 'shield'], ['activity', 'Activity log', 'list'], ['settings', 'Settings', 'gear']]],
];
const TITLES = Object.fromEntries(NAV.flatMap(([, l]) => l.map(([k, t]) => [k, t])));
let badges = {};
const side = document.getElementById('side'), scrim = document.getElementById('scrim');
const openSide = (o) => { side.classList.toggle('open', o); scrim.classList.toggle('on', o); };
scrim.addEventListener('click', () => openSide(false));
document.getElementById('burger').append(icon('menu'));
document.getElementById('srch').append(icon('search'));
document.getElementById('srch').addEventListener('click', () => openSearch());
addEventListener('keydown', (e) => { if (token && ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')))) { e.preventDefault(); openSearch(); } });
document.getElementById('burger').addEventListener('click', () => openSide(true));
function go(t) { tab = t; openSide(false); draw(); scrollTo({ top: 0 }); }
function paintNav() {
  side.replaceChildren(
    h('div', { class: 'sb-h' }, h('div', { class: 'sb-l' }), h('div', { class: 'sb-t' }, 'Key Store Admin'), h('button', { class: 'ib', id: 'close', 'aria-label': 'Close', onclick: () => openSide(false) }, icon('x'))),
    h('div', { class: 'sb-n' }, NAV.map(([g, items]) => h('div', {}, h('div', { class: 'sb-g' }, g), items.map(([k, t, ic]) => {
      const n = k === 'payments' ? badges.pay : k === 'products' ? badges.low : k === 'tickets' ? badges.tk : 0;
      return h('button', { class: 'sb-i' + (tab === k ? ' on' : ''), onclick: () => go(k) }, icon(ic), h('span', {}, t), n ? h('b', { class: 'bdg' }, String(n)) : null);
    })))),
    h('div', { class: 'sb-f' },
      h('a', { class: 'sb-i', href: '/', target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, icon('ext'), h('span', {}, 'View shop')),
      h('button', { class: 'sb-i', id: 'logout' }, icon('out'), h('span', {}, 'Log out'))));

// Group every ticket of one customer into a single conversation.

    const c = m.get(t.username) || { user: t.username, tickets: [], msgs: [], unread: 0, updatedAt: 0 };
    c.tickets.push(t); c.unread += t.unread ? 1 : 0; c.updatedAt = Math.max(c.updatedAt, t.updatedAt);

}

async function downloadAuth(path, name) {
  try {
    const r = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('Download failed');
    const a = h('a', { href: URL.createObjectURL(await r.blob()), download: name }); document.body.append(a); a.click(); a.remove();
  } catch (e) { toast(e.message); }
}

// ---------- banners ----------
function shrinkImage(file, maxW, q) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxW / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => no(new Error('Could not read this image'));
    img.src = url;
  });
}
async function bannersView() {
  view.replaceChildren(busy());
  try {
    const list = await api('GET', '/api/admin/banners');
    const imgIn = h('input', { type: 'url', placeholder: 'https://... image link (best, no size limit)' });
    const file = h('input', { type: 'file', accept: 'image/*' });
    const title = h('input', { placeholder: 'Title (optional)', maxlength: '80' });
    const link = h('input', { placeholder: 'Click link (optional) https://...' });
    const prev = h('img', { style: 'max-width:100%;border-radius:12px;display:none' });
    let data = '';
    file.addEventListener('change', async () => {
      if (!file.files[0]) return;
      try { data = await shrinkImage(file.files[0], 1200, 0.72); prev.src = data; prev.style.display = 'block'; toast('Compressed to ' + Math.round(data.length / 1024) + ' KB'); } catch (e) { toast(e.message); }
    });
    const add = h('button', { class: 'btn primary' }, 'Add banner');
    add.addEventListener('click', async () => {
      const image = imgIn.value.trim() || data;
      if (!image) return toast('Upload an image or paste a link');
      add.disabled = true;
      try { await api('POST', '/api/admin/banners', { image, title: title.value, link: link.value }); toast('Banner added'); bannersView(); } catch (e) { toast(e.message); add.disabled = false; }
    });
    const act = (b, body) => async () => { try { await api('PUT', '/api/admin/banners/' + b.id, body); bannersView(); } catch (e) { toast(e.message); } };
    view.replaceChildren(h('div', { class: 'stack' },
      h('div', { class: 'card stack' }, h('h3', {}, 'New banner'),
        h('p', { class: 'muted small' }, 'Best size 1200x400. Uploaded photos are auto-compressed, but a link (imgbb, Cloudinary) keeps your database light. Max 8 banners.'),
        file, prev, h('div', { class: 'muted small' }, 'or'), imgIn, title, link, add),
      h('h2', {}, 'Live banners (' + list.length + ')'),
      ...list.map((b, i) => h('div', { class: 'card stack' },
        h('img', { src: b.image, style: 'width:100%;border-radius:12px;max-height:160px;object-fit:cover', alt: '' }),
        h('div', { class: 'row' }, h('b', {}, b.title || 'Untitled'), h('span', { class: 'tag ' + (b.active ? 'ok' : 'bad') }, b.active ? 'visible' : 'hidden')),
        b.link ? h('div', { class: 'muted small', style: 'word-break:break-all' }, b.link) : null,
        h('div', { class: 'gap' },
          h('button', { class: 'btn', disabled: i === 0 ? 'disabled' : false, onclick: act(b, { move: 'up' }) }, '↑'),
          h('button', { class: 'btn', disabled: i === list.length - 1 ? 'disabled' : false, onclick: act(b, { move: 'down' }) }, '↓'),
          h('button', { class: 'btn', onclick: act(b, { active: !b.active }) }, b.active ? 'Hide' : 'Show'),
          h('button', { class: 'btn danger', onclick: async () => { if (!confirm('Delete this banner?')) return; try { await api('DELETE', '/api/admin/banners/' + b.id); bannersView(); } catch (e) { toast(e.message); } } }, 'Delete')))),
      list.length ? null : h('p', { class: 'muted' }, 'No banners yet. The shop shows no slider until you add one.')));
  } catch (e) { view.replaceChildren(errBox(e)); }
}

    const secs = h('input', { value: String(s.bannerSeconds), inputmode: 'numeric' });

    const pon = h('input', { type: 'checkbox', checked: s.popupActive ? 'checked' : false, style: 'width:auto' });
    const sw = h('div', { class: 'gap' });

    save.addEventListener('click', async () => {
      save.disabled = true;
      try { await api('PUT', '/api/admin/settings', { theme, accent: accent === null ? '' : acc.dataset.set ? acc.value : accent, bannerSeconds: Number(secs.value), popup: popup.value, popupActive: pon.checked }); toast('Saved. Refresh the shop to see it.'); } catch (e) { toast(e.message); }

          h('button', { class: 'btn', onclick: () => downloadAuth('/api/admin/orders.csv', 'orders.csv') }, 'Export orders CSV'),

        h('p', { class: 'muted small' }, 'The backup contains all keys. Keep it private.')),
      h('div', { class: 'card stack' }, h('h3', {}, 'Launch cleanup'),
        h('p', { class: 'muted small' }, 'Deletes all customers, orders, deposits, wallet history, tickets and reviews (your test data). Products, keys, coupons, banners and settings stay. Download a backup first.'),
        h('label', { class: 'gap', style: 'align-items:center' }, restoreKeys, ' Make keys that were sold during testing available again'),
        h('button', { class: 'btn danger', onclick: async () => {
          const t = prompt('This cannot be undone. Type DELETE TEST DATA to continue.');

          try { const r = await api('POST', '/api/admin/clear-test-data', { confirm: t, restoreKeys: restoreKeys.checked }); toast('Cleared ' + r.cleared.users + ' users, ' + r.cleared.orders + ' orders, ' + r.cleared.payments + ' payments'); } catch (e) { toast(e.message); }
        } }, 'Delete test data'))));
  } catch (e) { view.replaceChildren(errBox(e)); }
}
