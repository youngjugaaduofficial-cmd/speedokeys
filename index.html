<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="description" content="Digital gift cards and gaming codes with secure checkout and instant delivery.">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Key Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#07080f;--s1:#0f1220;--s2:#161a2e;--ln:#252b48;--tx:#eef1fa;--mu:#9aa3c0;--ac:#b6ff3c;--cy:#3dd6ff;--rd:#ff5d73;--r:12px}
:root[data-theme=ocean]{--bg:#04121c;--s1:#082131;--s2:#0d3047;--ln:#16506e;--ac:#38bdf8;--cy:#2dd4bf}
:root[data-theme=sunset]{--bg:#150a0a;--s1:#221110;--s2:#331a16;--ln:#5a2d22;--ac:#fb923c;--cy:#fbbf24}
:root[data-theme=emerald]{--bg:#05110c;--s1:#0a1c14;--s2:#10291d;--ln:#1e4a35;--ac:#34d399;--cy:#a3e635}
:root[data-theme=royal]{--bg:#0b0714;--s1:#140d24;--s2:#1e1336;--ln:#3a2865;--ac:#a78bfa;--cy:#e879f9}
:root[data-theme=light]{--bg:#f3f5fb;--s1:#fff;--s2:#eef1fa;--ln:#d5dbee;--tx:#141830;--mu:#5b6486;--ac:#2563eb;--cy:#0891b2;--rd:#dc2626}
:root[data-theme=light] .btn.p,:root[data-theme=light] .cat.on{color:#fff}
:root[data-theme=light] header,:root[data-theme=light] nav{background:rgba(255,255,255,.92)}
:root[data-theme=light] .face,:root[data-theme=light] .key{color:#07080f}
.slider{position:relative;margin:16px 0 4px;border-radius:16px;overflow:hidden;aspect-ratio:3/1;width:100%;background:var(--s1);touch-action:pan-y}
@media(max-width:600px){.slider{aspect-ratio:2.2/1}}
.slides{display:flex;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.slide{flex:none;width:100%;height:100%;position:relative;display:block}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide span{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font:700 18px Inter,system-ui,sans-serif}
.dots{position:absolute;bottom:8px;right:12px;display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.5);transition:.3s}.dots i.on{width:20px;background:var(--ac)}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer;z-index:2}
.fav.on{color:var(--rd)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 'DM Sans',system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,.hd{font-family:Inter,system-ui,sans-serif,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(7,8,15,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:10px;min-height:60px}
.logo{font:700 22px Inter,system-ui,sans-serif;color:var(--ac);letter-spacing:1px;flex:1;cursor:pointer}
.chip{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--cy);border-radius:99px;background:0;color:var(--cy);font-weight:700;cursor:pointer}
.btn{min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);font-weight:700;cursor:pointer;transition:transform .15s,filter .15s,border-color .15s}
.btn:hover{border-color:var(--ac)}.btn:active{transform:scale(.96)}
.btn.p{background:var(--ac);color:#07080f;border-color:var(--ac)}.btn.p:hover{filter:brightness(1.1)}
.btn.full{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}
.ann{background:var(--s2);border-bottom:1px solid var(--ln);font-size:13px;text-align:center;padding:6px 12px;color:var(--ac)}
.maint{background:var(--rd);color:#fff;text-align:center;padding:10px;font-weight:700}
.hero{padding:32px 0 8px;animation:up .5s both}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.05}.hero h1 span{color:var(--ac)}
.hero p{color:var(--mu);max-width:520px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
input,select{background:var(--s1);border:1px solid var(--ln);border-radius:10px;min-height:44px;padding:0 14px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--ac)}
.tools input{flex:1 1 220px}.tools select{width:auto}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.cat{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:0;color:var(--mu);cursor:pointer;transition:.15s}
.cat.on{background:var(--ac);color:#07080f;border-color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;cursor:pointer;animation:up .45s backwards;animation-delay:calc(var(--i)*40ms);transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 10px 30px -12px var(--ac)}
.face{height:104px;display:flex;align-items:flex-end;padding:10px 12px;font:700 30px Inter,system-ui,sans-serif;color:#07080f;position:relative;overflow:hidden}
.face:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s}
.card:hover .face:after{transform:translateX(100%)}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px}
.cb b{font-size:15px}.cb small{color:var(--mu)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pr b{font:700 19px Inter,system-ui,sans-serif}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--ac)}.tag.out{color:var(--rd)}
.sk{height:200px;border-radius:var(--r);background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.2s infinite}
.panel{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin:14px 0;animation:up .4s both}
.big{font:700 44px Inter,system-ui,sans-serif;color:var(--cy)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.pos{color:var(--ac)}.neg{color:var(--rd)}.mu{color:var(--mu)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(15,18,32,.95);backdrop-filter:blur(12px);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;background:0;border:0;color:var(--mu);cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:var(--s1);border:1px solid var(--ln);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;animation:sl .3s cubic-bezier(.2,.9,.3,1)}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:20px}}
.key{background:#000;border:1px dashed var(--ac);border-radius:10px;padding:14px;font:700 18px Inter,system-ui,sans-serif;letter-spacing:1px;color:var(--ac);word-break:break-all;animation:glow 1.6s infinite}
.err{color:var(--rd)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ac);padding:10px 18px;border-radius:99px;z-index:99;animation:up .3s;max-width:90vw}
.spin{width:22px;height:22px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:rt .7s linear infinite;display:inline-block}
.sup{position:fixed;right:14px;bottom:150px;z-index:19}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}}@keyframes sl{from{transform:translateY(60px);opacity:0}}
@keyframes sh{to{background-position:-200% 0}}@keyframes rt{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 22px -4px var(--ac)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
body:before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 40% at 20% 15%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 70%),radial-gradient(35% 35% at 85% 8%,color-mix(in srgb,var(--cy) 18%,transparent),transparent 70%),radial-gradient(40% 40% at 60% 95%,color-mix(in srgb,var(--ac) 10%,transparent),transparent 70%);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.12)}}
header{transition:box-shadow .3s}header.sc{box-shadow:0 10px 30px -14px #000}
.btn{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--cy),var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh2 4s linear infinite}
@keyframes sh2{to{background-position:-200% 0}}
.trust{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.trust i{font-style:normal;font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--ln);background:color-mix(in srgb,var(--s1) 80%,transparent);color:var(--mu)}
.trust i:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-right:7px;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.4}}
.ann{overflow:hidden;white-space:nowrap}.ann .mq{display:inline-block;padding-left:100%;animation:mq 20s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.card{animation-fill-mode:backwards;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform}
.card:hover{translate:0 -4px;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card:active{scale:.97}
.face{font:500 12px 'DM Sans';align-items:flex-start;justify-content:space-between}
.face:before{content:attr(data-i);position:absolute;right:-4px;bottom:-22px;font:700 84px/1 Inter,system-ui,sans-serif;color:#07080f;opacity:.2}
.fl{background:rgba(0,0,0,.4);color:#fff;padding:2px 9px;border-radius:99px;font:500 11px 'DM Sans';position:relative}
.rb{position:absolute;left:0;bottom:10px;background:var(--rd);color:#fff;font:700 10px 'DM Sans';font-style:normal;padding:3px 9px;border-radius:0 6px 6px 0;animation:pl 1.4s infinite}
.pg>*{animation:up .4s backwards}.pg>*:nth-child(2){animation-delay:.05s}.pg>*:nth-child(3){animation-delay:.1s}.pg>*:nth-child(4){animation-delay:.15s}
nav:before{content:'';position:absolute;top:0;left:0;height:3px;width:20%;background:var(--ac);border-radius:0 0 6px 6px;transform:translateX(calc(var(--n,0)*100%));transition:transform .4s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 14px var(--ac)}
nav button{transition:color .2s,transform .2s}nav button.on svg{animation:bn .4s}
@keyframes bn{40%{transform:translateY(-4px) scale(1.15)}}
.wc{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--cy) 22%,var(--s1)),var(--s1) 70%)}
.wc:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);transform:translateX(-100%);animation:ws 5s infinite}
@keyframes ws{60%,100%{transform:translateX(100%)}}
.ck svg{width:68px;height:68px;fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto}
.ck circle{stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s .1s forwards}.ck path{stroke-dasharray:50;stroke-dashoffset:50;animation:dr .4s .6s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.sheet{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.empty{text-align:center;padding:40px 10px;color:var(--mu);grid-column:1/-1}

.ib{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:0;color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib i{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--rd);box-shadow:0 0 8px var(--rd)}
.hs{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}.hs .card{flex:none;width:210px;scroll-snap-align:start}
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 6px}.sec h3{font-size:20px}
.bd{font:700 10px 'DM Sans';background:var(--ac);color:#07080f;padding:2px 8px;border-radius:99px;position:relative}
.old{color:var(--mu);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:400}
.off{font:700 11px 'DM Sans';color:var(--ac);margin-left:6px}
.rt{color:#ffc83d;font-size:12px;letter-spacing:1px}.rt em{color:var(--mu);font-style:normal;letter-spacing:0}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--s2);border:1px solid var(--ln);white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--ac) 22%,var(--s2))}.bub small{display:block;opacity:.6;margin-top:4px;font-size:11px}
textarea{background:var(--s1);border:1px solid var(--ln);border-radius:10px;min-height:84px;padding:10px 14px;width:100%;outline:0;resize:vertical;font:inherit;color:inherit}
textarea:focus{border-color:var(--ac)}
.stp{display:flex;gap:6px;justify-content:center;font-size:38px;cursor:pointer;color:#ffc83d;user-select:none}.stp span{transition:transform .15s}.stp span:active{transform:scale(1.3)}
details summary{cursor:pointer;color:var(--ac);font-weight:700;margin:4px 0}
.offl{position:fixed;left:0;right:0;top:0;z-index:98;background:var(--rd);color:#fff;text-align:center;padding:6px;font-size:13px}

body{background:var(--bg);padding-bottom:calc(82px + env(safe-area-inset-bottom))}body:before{display:none!important}header{background:rgba(8,10,13,.96);border-bottom:1px solid #263039;box-shadow:0 8px 24px #0004}.logo{color:var(--ac);background:none!important;-webkit-text-fill-color:var(--ac);letter-spacing:1.8px}

api('GET','/api/config').then(c=>{cfg={...cfg,...c};chrome();draw();if(c.popup&&sessionStorage.getItem('ks_pop')!==c.popup){sessionStorage.setItem('ks_pop',c.popup);const o=modal(h('h2',{},cfg.siteName),h('p',{},c.popup),h('button',{class:'btn p full',onclick:()=>o.close()},'OK'))}}).catch(()=>{});const seoSlug=location.pathname==='/'?'home':decodeURIComponent(location.pathname.slice(1).split('/')[0]||'home');api('GET','/api/seo/'+encodeURIComponent(seoSlug)).then(meta=>{if(meta.title)document.title=meta.title;let d=document.querySelector('meta[name=description]');if(!d){d=document.createElement('meta');d.name='description';document.head.append(d)}if(meta.description)d.content=meta.description;let robots=document.querySelector('meta[name=robots]');if(!robots){robots=document.createElement('meta');robots.name='robots';document.head.append(robots)}robots.content=meta.noindex?'noindex, nofollow':'index, follow';if(meta.canonical){let c=document.querySelector('link[rel=canonical]');if(!c){c=document.createElement('link');c.rel='canonical';document.head.append(c)}c.href=meta.canonical}}).catch(()=>{});
loadNotices();if(token){api('GET','/api/me').then(m=>{me=m;chrome();if(tab!=='shop')draw()}).catch(()=>{});pollTk();setInterval(pollTk,60000)}
try{products=await api('GET','/api/products');try{sessionStorage.setItem('ks_p',JSON.stringify(products))}catch(e){}}catch(e){toast(e.message)}
draw();payReturn()})();
