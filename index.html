<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<meta name="description" content="Digital gift cards and gaming codes with secure checkout and instant delivery.">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Key Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Key Store UI v3: one compact system (no stacked overrides) ===== */
:root{--bg:#070a10;--s1:#0d121c;--s2:#131b2a;--ln:#1c2842;--tx:#eaf2ff;--mu:#8a9bb8;--ac:#00e5ff;--ac2:#3b82f6;--ok:#34d399;--rd:#ff5470;--warn:#fbbf24;--r:14px;--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 'DM Sans',system-ui,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-family:'Chakra Petch',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
.mu{color:var(--mu)}.pos{color:var(--ok)}.neg{color:var(--rd)}.err{color:var(--rd);font-size:14px}.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(7,10,16,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:8px;min-height:54px}
.logo{flex:1;min-width:0;font:700 17px 'Chakra Petch',sans-serif;letter-spacing:.6px;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ib{position:relative;flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center;cursor:pointer;font-size:18px}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib i{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--rd)}
.chip{flex:none;display:flex;align-items:center;min-height:34px;padding:0 12px;border:1px solid var(--ln);border-radius:99px;background:var(--s1);font-weight:700;font-size:14px;cursor:pointer}

/* buttons: small, calm */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s var(--ease),border-color .15s,filter .15s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04111c;border:0}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.full{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}
.btn.ghost{background:transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

input,select,textarea{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:10px;min-height:42px;padding:0 12px;outline:0}
textarea{padding:10px 12px;resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}

.ann{background:var(--s2);border-bottom:1px solid var(--ln);font-size:13px;text-align:center;padding:6px 12px;color:var(--ac);overflow:hidden;white-space:nowrap}
.ann .mq{display:inline-block;padding-left:100%;animation:mq 20s linear infinite}
.maint{background:var(--rd);color:#fff;text-align:center;padding:8px;font-weight:700;font-size:14px}

/* shop toolbar */
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px}
.wb{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--mu)}.wb b{font:700 20px 'Chakra Petch',sans-serif;color:var(--ac)}
.slider{position:relative;margin:8px 0 4px;border-radius:14px;overflow:hidden;aspect-ratio:3/1;background:var(--s1);touch-action:pan-y}
@media(max-width:600px){.slider{aspect-ratio:2.4/1}}
.slides{display:flex;height:100%;transition:transform .6s var(--ease)}
.slide{flex:none;width:100%;height:100%;position:relative;display:block}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide span{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-weight:700}
.dots{position:absolute;bottom:8px;right:12px;display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.5);transition:.3s}.dots i.on{width:16px;background:var(--ac)}
.tools{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px}
.sb{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--ln);border-radius:10px;background:var(--s1)}.sb input{border:0;background:0;padding:0;min-height:40px}.sb:focus-within{border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.ch{flex:none;min-height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--ln);background:var(--s1);color:var(--mu);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.ch.on{background:var(--ac);border-color:var(--ac);color:#04111c}

/* product card */
.pgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.pgrid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1000px){.pgrid{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;animation:up .4s var(--ease) backwards;transition:border-color .2s}
.pc:hover{border-color:#2b4570}
.ph{display:flex;gap:10px;align-items:center}
.pth{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font:700 18px 'Chakra Petch',sans-serif;color:#fff;background-size:cover;background-position:center}
.pt{min-width:0;flex:1}.pt b{display:block;font-size:16px;line-height:1.25}.pt small{color:var(--mu)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--ac);vertical-align:middle}.tag.out{color:var(--rd);border-color:#4a1d28}.tag.hot{background:var(--rd);border-color:var(--rd);color:#fff}
.rt{color:#ffc83d;font-size:12px;letter-spacing:1px}.rt em{color:var(--mu);font-style:normal;letter-spacing:0}
.fts{display:flex;flex-direction:column;gap:5px}
.ft{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;background:var(--s2);border-left:3px solid var(--ac);font-size:13.5px;line-height:1.35}
.ft:before{content:'✓';color:var(--ok);font-weight:800}
.more{align-self:flex-start;background:0;border:0;color:var(--ac);font-size:13px;font-weight:700;cursor:pointer;padding:2px 0}
.pls{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.pl.out{opacity:.65}
.pl-n{font-weight:700;color:var(--ac);font-size:14px}
.pl-p{font:700 18px 'Chakra Petch',sans-serif;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pl-p s{font:400 12px 'DM Sans';color:var(--mu)}.pl-p em{font:700 11px 'DM Sans';font-style:normal;color:var(--warn)}
.pl-a{display:flex;align-items:center;gap:8px;flex:none}
.qty{display:flex;align-items:center;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--s1)}
.qty button{width:28px;height:32px;border:0;background:0;font-size:16px;cursor:pointer}.qty button:active{background:var(--s2)}
.qty .qv{min-width:24px;text-align:center;font-weight:700;font-size:14px}
.empty{text-align:center;padding:36px 10px;color:var(--mu)}

/* panels / lists */
.panel{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin:10px 0;animation:up .35s var(--ease) both}
.big{font:700 28px 'Chakra Petch',sans-serif;color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.sec{margin:18px 0 8px;font-size:18px}
.key{background:#02050a;border:1px dashed var(--ac);border-radius:10px;padding:10px 12px;font:700 15px ui-monospace,Menlo,monospace;letter-spacing:.5px;color:var(--ac);word-break:break-all}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:var(--s1);border:1px solid var(--ln);border-radius:18px 18px 0 0;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;animation:sl .3s var(--ease);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:19px}
.ck svg{width:60px;height:60px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto}
.ck circle{stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s .1s forwards}.ck path{stroke-dasharray:50;stroke-dashoffset:50;animation:dr .4s .6s forwards}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ac);padding:8px 16px;border-radius:99px;z-index:99;max-width:90vw;font-size:14px;animation:up .3s}
.spin{width:20px;height:20px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:rt .7s linear infinite;display:inline-block}
.offl{position:fixed;left:0;right:0;top:0;z-index:98;background:var(--rd);color:#fff;text-align:center;padding:5px;font-size:13px}
details summary{cursor:pointer;color:var(--ac);font-weight:700;margin:2px 0}
.stp{display:flex;gap:6px;justify-content:center;font-size:34px;cursor:pointer;color:#ffc83d;user-select:none}

/* drawer */
nav#nav{position:fixed;top:0;bottom:0;left:0;width:min(80vw,290px);overflow-y:auto;background:#050810;border-right:1px solid var(--ln);transform:translateX(-102%);transition:transform .32s var(--ease);z-index:60;padding-bottom:20px}
body.mo nav#nav{transform:none;box-shadow:12px 0 40px #000a}
#bd{position:fixed;inset:0;background:#0008;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}body.mo #bd{opacity:1;pointer-events:auto}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.dt{font:700 20px 'Chakra Petch',sans-serif;color:var(--ac)}.ds{color:var(--mu);font-size:12px}
.dl{padding:6px 18px;font-size:11px;letter-spacing:.2em;color:var(--mu);text-transform:uppercase}
.di{display:flex;align-items:center;gap:12px;width:calc(100% - 20px);min-height:44px;margin:3px 10px;padding:0 10px;border:0;border-radius:10px;background:0;color:var(--tx);font-size:15px;cursor:pointer;text-align:left}
.di.on{background:#0a2733;color:var(--ac);box-shadow:inset 3px 0 var(--ac)}.di.out{color:var(--rd)}
.dic{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--s1);font-size:15px}

/* WhatsApp-style chat */
#view.chatmode{padding-bottom:0}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 54px - 16px);min-height:360px;margin-top:8px;border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:#0a0f17}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s1);border-bottom:1px solid var(--ln)}
.cav{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04111c;display:grid;place-items:center;font:700 17px 'Chakra Petch',sans-serif}
.chat-head .t{flex:1;min-width:0;line-height:1.25}.chat-head .t b{display:block}.chat-head .t span{font-size:12px;color:var(--mu)}
.chat-body{flex:1;overflow:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(#ffffff07 1px,transparent 1px);background-size:18px 18px}
.cday{align-self:center;margin:8px 0}.cday span{font-size:11px;color:var(--mu);background:var(--s1);border-radius:8px;padding:3px 10px}
.msg{max-width:min(82%,460px);padding:6px 10px 3px;border-radius:12px;word-break:break-word;animation:up .25s var(--ease)}
.msg.in{align-self:flex-start;background:var(--s2);border-top-left-radius:3px}
.msg.out{align-self:flex-end;background:#0b4a5a;border-top-right-radius:3px}
.msg .tx{white-space:pre-wrap;line-height:1.35}
.msg .ts{font-size:11px;color:#ffffff90;text-align:right;margin-top:1px}
.msg .tk{letter-spacing:-3px;font-weight:800;margin-left:3px}.msg .tk.seen{color:#4fd1ff}
.cempty{margin:auto;text-align:center;color:var(--mu);display:flex;flex-direction:column;gap:10px;align-items:center;padding:20px}
.cempty .ch{color:var(--tx)}
.chat-bar{display:flex;gap:8px;align-items:flex-end;padding:8px;background:var(--s1);border-top:1px solid var(--ln)}
.chat-in{flex:1;resize:none;border-radius:22px;min-height:42px;max-height:110px;padding:10px 14px;line-height:1.3}
.csend{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04111c;display:grid;place-items:center;cursor:pointer}.csend:disabled{opacity:.5}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04111c;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px #0008}
.fab svg{width:22px;height:22px;fill:currentColor}.fab i{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:var(--rd);border:2px solid var(--bg)}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}}@keyframes sl{from{transform:translateY(40px);opacity:0}}
@keyframes rt{to{transform:rotate(360deg)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes mq{to{transform:translateX(-100%)}}
@keyframes sh{to{background-position:-200% 0}}
.sk{height:190px;border-radius:var(--r);background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.2s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="top"></div>
<header><div class="wrap bar"><button class="ib" id="menu" aria-label="Menu">☰</button><div class="logo" id="logo">KEY STORE</div><button class="ib" id="bell" aria-label="Notices"></button><button class="chip" id="wal"></button><button class="btn sm" id="addf">+ Add</button><button class="btn sm" id="login">Login</button><button class="btn sm p" id="reg">Register</button></div></header>
<main class="wrap" id="view"></main>
<button class="fab" id="fab" aria-label="Support chat" hidden></button>
<div id="bd"></div><nav id="nav"></nav>
<div id="toast" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(a[k]===false||a[k]==null)continue;if(k==='class')e.className=a[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const R=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const D=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const HM=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dayLabel=ms=>{const d=new Date(ms),t=new Date(),k=x=>x.toDateString();if(k(d)===k(t))return 'Today';const y=new Date(t);y.setDate(t.getDate()-1);return k(d)===k(y)?'Yesterday':d.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})};
let token=st.get('ks_token'),me=null,cfg={siteName:'Key Store',announcement:'',minTopup:10,maxTopup:10000},products=null,cat='All',q='',tab='shop',onlyStock=false;
try{products=JSON.parse(sessionStorage.getItem('ks_p'))}catch(e){}
async function api(m,p,b){let r;try{r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined})}catch(e){throw new Error('Server se connect nahi ho paa raha. Internet check karo.')}
let d={};try{d=await r.json()}catch(e){}
if(!r.ok){if(r.status===401&&token)logout();const e=new Error(d.error||'Error '+r.status);e.code=r.status;e.data=d;throw e}return d}
function logout(){token=null;me=null;tab='shop';st.del('ks_token');chrome();draw()}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const copy=async(t)=>{try{await navigator.clipboard.writeText(t);toast('Copy ho gaya')}catch(e){toast('Copy nahi hua, manually select karo')}};
const hue=s=>Math.abs([...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));
const bellSvg='<svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 004 0"/></svg>';
const sendSvg='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.4 20.4l17.5-7.5a1 1 0 000-1.8L3.4 3.6a1 1 0 00-1.4 1.2l2 5.7 9 1.5-9 1.5-2 5.7a1 1 0 001.4 1.2z"/></svg>';
const chatSvg='<svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.6 1.3 4.9 3.4 6.5L4.600 21l3.600-1.900c1.200.4 2.500.6 3.800.6 5.500 0 10-3.900 10-8.700S17.500 3 12 3z"/></svg>';
function modal(...c){const ov=h('div',{class:'ov',onclick:e=>{if(e.target===ov)close()}},h('div',{class:'sheet'},...c));const close=()=>ov.remove();document.body.append(ov);ov.close=close;return ov}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.ov')?.remove();if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){const s=document.querySelector('.sb input');if(s){e.preventDefault();s.focus()}}});
function count(el,to){if(!el)return;const t0=performance.now(),f=parseFloat(el.dataset.v||0);el.dataset.v=to;const s=t=>{const k=Math.min(1,(t-t0)/500);el.textContent=R(f+(to-f)*k);if(k<1)requestAnimationFrame(s)};requestAnimationFrame(s)}
const TABS=[['dash','Dashboard','⬡'],['shop','Buy Codes','◈'],['orders','My Codes','⚿'],['wallet','Wallet / Deposit','◎'],['history','History','◷'],['help','Support','✉'],['me','Profile & Password','◉'],['refer','Refer & Earn','⟳']];
function theme(){const r=document.documentElement;if(cfg.accent&&/^#[0-9a-f]{6}$/i.test(cfg.accent))r.style.setProperty('--ac',cfg.accent);else r.style.removeProperty('--ac')}
function menu(f){document.body.classList.toggle('mo',f)}
let tkUnread=0;
function chrome(){theme();const g=!me,items=g?[['shop','Buy Codes','◈'],['login','Login','→'],['reg','Register','✎']]:TABS;
